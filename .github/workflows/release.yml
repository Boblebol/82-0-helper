name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Build Extension
        run: npm run build

      - name: Zip extension
        run: cd dist && zip -r ../82-0-helper-${{ github.ref_name }}.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: 82-0-helper-${{ github.ref_name }}.zip
          generate_release_notes: true
